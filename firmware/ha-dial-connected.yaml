packages:
  hardware: !include ha-dial.yaml

external_components:
  - source: ../components
    components: [ha_dial]

wifi:
  reboot_timeout: 0s
  ap:
    ap_timeout: 30s
    ssid: "HA Dial Setup"
    password: "ha-dial-setup"

captive_portal:

api:
  reboot_timeout: 0s
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome

button:
  - platform: restart
    name: Restart
  - platform: safe_mode
    name: Restart in Safe Mode
    disabled_by_default: true
  - platform: factory_reset
    name: Factory Reset
    disabled_by_default: true

font:
  - id: !extend hello_font
    size: 14
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

ha_dial:
  id: dial_ui
  device: ha_dial
  display: round_display
  font: hello_font
  touchscreen: dial_touch

display:
  - id: !extend round_display
    lambda: |-
      id(dial_ui).draw(it);

text_sensor:
  - platform: wifi_info
    ip_address:
      id: dial_ip
      internal: true
      on_value:
        - component.update: round_display

sensor:
  - id: !extend dial_encoder
    on_value:
      - id: !remove encoder_redraw
    on_clockwise:
      - lambda: id(dial_ui).rotate(1);
    on_anticlockwise:
      - lambda: id(dial_ui).rotate(-1);

binary_sensor:
  - platform: gpio
    id: front_button
    pin:
      number: GPIO42
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - min_length: 30ms
        max_length: 500ms
        then:
          - lambda: id(dial_ui).press();
      - min_length: 5s
        max_length: 60s
        then:
          - lambda: id(dial_ui).request_wifi_reset();

switch:
  - platform: gpio
    id: power_hold
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
    internal: true

  - platform: template
    name: Show Settings
    icon: mdi:cog
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(dial_ui).set_settings_enabled(true);
    turn_off_action:
      - lambda: id(dial_ui).set_settings_enabled(false);

touchscreen:
  - platform: ft5x06
    id: dial_touch
    display: round_display
    i2c_id: internal_i2c
    address: 0x38
    on_touch:
      - lambda: id(dial_ui).touch(touch.x, touch.y);
