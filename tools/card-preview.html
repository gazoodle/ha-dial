<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HA Dial scene preview</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-content:center;gap:20px;background:#101216;color:white;font-family:system-ui}
  canvas{width:360px;height:360px;border-radius:50%;outline:10px solid #ed6c22;image-rendering:pixelated}
  label{display:flex;justify-content:space-between;gap:20px}select{font:inherit}
</style>
<body>
<canvas width="240" height="240" aria-label="HA Dial scene"></canvas>
<label>Theme<select id="theme"></select></label>
<label>Style<select id="style"><option value="0">NAV-ORBIT</option><option value="1">CTL-LIGHT-INSTRUMENT</option><option value="2">CTL-SWITCH-INSTRUMENT</option><option value="3">CTL-COVER-INSTRUMENT</option></select></label>
<p>Shared scene fixtures. Use Home Assistant to configure and simulate a live tree.</p>
<script type="module">
  import { renderScene } from "../custom_components/ha_dial/www/scene.js";
  const scenes = await (await fetch("../tests/fixtures/scenes.json")).json();
  const themes = ["ember", "verdant", "cobalt", "rose", "acid", "alloy"];
  const theme = document.querySelector("#theme"), style = document.querySelector("#style");
  themes.forEach((name,index) => theme.add(new Option(name,index)));
  const render = () => renderScene(document.querySelector("canvas"),scenes[Number(theme.value)*4+Number(style.value)]);
  theme.addEventListener("change",render);style.addEventListener("change",render);render();
</script>
</body>
</html>
